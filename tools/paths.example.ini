; Copy to <workspace>\paths.local.ini and adjust. That file is never committed.
; Tools find the workspace via the EQD_ROOT environment variable, or by walking up from the repo
; to the first directory that contains paths.local.ini.

[workspace]
; Your own EverQuest Trilogy binaries go under <original>\trilogy\ (eqgame.exe, eqmain.dll, eqgfx_dx7.dll).
original = original
ghidra   = ghidra
build    = build

[install]
; Optional: a runnable client install (left in place, never modified)
;trilogy  = <path to your EverQuest Trilogy install>

[reference]
; Optional: unpacked community sources (read-only, never copied into a repo)
;eqemu            = <path>\EQEmu-master
;showeq_current   = <path>\ShowEQ-master
;macroquest       = <path>\macroquest-master
;eqclassic        = <path>\EQClassic-master
;showeq_304       = <path>\ShowEQ-3.0.4
;macroquest_2002  = <path>\Src-20020603
;takp_server      = <path>\Server-main
;takp_lists       = <path>\TAKP-Client-Underthehood-main

[toolchain]
; Visual C++ 6.0 SP4 (eqgame.exe, eqgfx_dx7.dll) and SP5 (eqmain.dll). Not included; bring your own.
vc6     = C:\Program Files (x86)\Microsoft Visual Studio\VC98
;vc6_sp5 = <path to a VC6 SP5 VC98 folder>
; Optional: Ghidra 12.1.3 with PyGhidra (only for the byte-match / export tooling)
;ghidra = <path>\ghidra_12.1.3_PUBLIC
; Optional: objdiff-cli 3.8.2 for compare\objdiff_config.py
;objdiff_cli = <path>\objdiff-cli-windows-x86_64.exe
