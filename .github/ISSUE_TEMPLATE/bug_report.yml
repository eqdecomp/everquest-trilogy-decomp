name: Bug report
description: A tool, test or build step that fails or does the wrong thing.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach game files, binaries, memory dumps, disassembly listings or decompiler output**, and do
        not paste them into the text. Describe functions by image and address (e.g. `TRILOGY 0x0041A2C0`).
        Security issues: see SECURITY.md instead.
  - type: input
    id: tool
    attributes:
      label: Tool or test
      description: e.g. tools/compare/compare.py, a fixture path, hooks/build.bat
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command, and the output (pass/fail lines, the error). Remove local paths you don't want to share.
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: tools/doctor.py output
      render: text
  - type: input
    id: env
    attributes:
      label: Python version and Windows version
    validations:
      required: true
  - type: checkboxes
    id: provenance
    attributes:
      label: Provenance
      options:
        - label: I have not attached or pasted game files, memory dumps, disassembly listings or decompiler output.
          required: true
